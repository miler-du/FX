<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no,shrink-to-fit=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1326">
<title>HAIYI｜駭異科技.FX</title>
<style>
:root{--bg:#070b18;--panel:#0c1326;--panel2:#141d38;--line:#1e2a4c;--tx:#e8ecf8;--mut:#8491b4;--cy:#22d3ee;--vi:#8b5cf6;--up:#26a69a;--dn:#ef5350;--buy:#2f7de1;--sell:#e0473f;--warn:#e3b341}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:calc(14px*var(--fz,1))/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:900px;margin:0 auto;padding-top:var(--padTop,max(env(safe-area-inset-top),0px));background:var(--panel)}
main{background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid;border-image:linear-gradient(90deg,var(--cy),var(--vi) 45%,var(--line) 80%) 1;background:var(--panel)}
#hSym{font-weight:700;font-size:calc(16px*var(--fz,1));padding:4px 8px;border:1px solid var(--line);border-radius:6px}
#hPx{flex:1;display:flex;gap:12px;font-variant-numeric:tabular-nums;font-size:calc(15px*var(--fz,1))}
#hPx small{color:var(--mut);font-size:calc(10px*var(--fz,1));display:block;line-height:1}
#stat{font-size:calc(11px*var(--fz,1));color:var(--mut);display:flex;align-items:center;gap:5px;max-width:150px;text-align:right;min-width:0}
#statTx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
#stat{flex:1;justify-content:flex-end;max-width:none}
.qc{margin-left:6px;flex:none;padding:5px 10px!important}
#dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
#gear{font-size:calc(20px*var(--fz,1));padding:2px 6px}
#banner{display:none;background:#3a2f0b;color:var(--warn);font-size:calc(12px*var(--fz,1));padding:5px 12px;text-align:center}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#vChart.on{display:flex;flex-direction:column;overflow:hidden}
#tfs{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
#tfs button{padding:5px 9px;border-radius:5px;color:var(--mut);font-size:calc(13px*var(--fz,1));white-space:nowrap}
#tfs button.on{background:var(--panel2);color:var(--tx);font-weight:600}
#tfs .sp{flex:1}
#cwrap{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#qbar{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);flex:none;align-items:stretch}
#qbar .b{flex:1;border-radius:8px;padding:6px 4px;color:#fff;font-weight:700;line-height:1.2}
#qbar .b small{display:block;font-weight:500;font-size:calc(13px*var(--fz,1));font-variant-numeric:tabular-nums}
.sellbg{background:var(--sell)}.buybg{background:var(--buy)}
#lotBox{display:flex;align-items:center;background:var(--panel2);border-radius:8px;border:1px solid var(--line)}
#lotBox button{width:32px;height:100%;font-size:calc(18px*var(--fz,1));color:var(--mut)}
#lotBox input{width:56px;text-align:center;background:none;border:0;outline:0;font-variant-numeric:tabular-nums}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:var(--navPB,env(safe-area-inset-bottom));flex:none}
nav button{flex:1;min-width:0;padding:8px 0 7px;color:var(--mut);font-size:calc(11px*var(--fz,1))}
nav button i{display:block;font-style:normal;font-size:calc(18px*var(--fz,1));line-height:1.2}
nav button.on{color:var(--cy)}
.row{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);gap:10px}
.row:active{background:var(--panel)}
.row .g{flex:1;min-width:0}
.row b{font-size:calc(15px*var(--fz,1))}
.mut{color:var(--mut)}.sm{font-size:calc(12px*var(--fz,1))}.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.cb{color:#58a6ff}.cs{color:#ff7b72}
.card{margin:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv span:first-child{color:var(--mut)}
h3{margin:14px 14px 4px;font-size:calc(12px*var(--fz,1));color:var(--mut);font-weight:600;letter-spacing:.05em}
.btn{padding:10px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--buy);border-color:var(--buy);color:#fff}
.btn.brand{background:linear-gradient(90deg,#0e9fb8,#6d47d9);border:0;color:#fff}
.btn.red{background:var(--sell);border-color:var(--sell);color:#fff}
.btn.full{width:100%}
.empty{padding:28px 14px;text-align:center;color:var(--mut)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
#shade.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:900px;max-height:88dvh;overflow-y:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 10px;font-size:calc(16px*var(--fz,1));display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{font-size:calc(22px*var(--fz,1));color:var(--mut);padding:0 6px}
label.f{display:block;margin:8px 0}
label.f span{display:block;font-size:calc(12px*var(--fz,1));color:var(--mut);margin-bottom:3px}
label.f input,label.f select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:calc(16px*var(--fz,1))}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.seg button{flex:1;padding:9px 4px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--tx)}
.seg button.on.s{background:var(--sell);color:#fff}.seg button.on.b{background:var(--buy);color:#fff}
.err{color:var(--dn);font-size:calc(13px*var(--fz,1));min-height:18px;margin:6px 0}
.hint{font-size:calc(12px*var(--fz,1));color:var(--mut);margin:6px 0}
.two{display:flex;gap:8px}.two>*{flex:1}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:calc(60px + env(safe-area-inset-top));background:#30363d;border:1px solid #484f58;padding:9px 14px;border-radius:8px;z-index:20;display:none;max-width:88%;font-size:calc(13px*var(--fz,1));text-align:center}
.chk{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line)}
.chk input:not(.sw){width:20px;height:20px}
a{color:var(--cy)}
.tag{font-size:calc(10px*var(--fz,1));padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--mut);margin-left:6px}

/* ---- HAIYI 品牌元素 ---- */
#brand,#acctBar,#side,#dockTabs{display:none}
#ctabs{display:flex;gap:2px;padding:4px 6px 0;overflow-x:auto;flex:none;background:var(--panel)}
#ctabs button{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;color:var(--mut);font-size:calc(13px*var(--fz,1));font-weight:600;white-space:nowrap}
#ctabs button small{font-weight:500;font-size:calc(11px*var(--fz,1));opacity:.8}
#ctabs button.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 2px 0 var(--cy)}
#ctabs i{font-style:normal;color:var(--mut);padding:0 2px;border-radius:4px}#ctabs i:hover{color:var(--dn)}
#ctabs #tabAdd{border-style:dashed;padding:6px 12px}
.irow{display:flex;align-items:flex-end;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.irow>input.sw{margin:0 0 6px}
.irow>b{width:92px;flex:none;padding-bottom:9px;font-size:calc(13.5px*var(--fz,1))}
.irow label{flex:1;min-width:0}.irow label span{display:block;font-size:calc(11px*var(--fz,1));color:var(--mut);margin-bottom:2px}
.irow label input,.irow label select{width:100%;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:calc(15px*var(--fz,1))}
.nwBar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 12px}
.nwBar .seg{margin:0;flex:1;min-width:260px;max-width:420px}.nwBar .seg button{padding:6px 4px;font-size:calc(13px*var(--fz,1))}
.nwLinks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:calc(12.5px*var(--fz,1))}
.nwTools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:6px 12px}.nwTools .seg{margin:0;min-width:220px}.nwTools .btn{padding:6px 12px}
.nwItem{display:flex;flex-direction:column;gap:3px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none}.nwItem:active{background:var(--panel2)}
.nwItem b{font-size:calc(15px*var(--fz,1));line-height:1.4;font-weight:600}.nwDesc{font-size:calc(12.5px*var(--fz,1));color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.calDay{padding:8px 12px 4px;font-weight:700;color:var(--cy);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.calRow{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line)}.calRow .g{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.calRow.hot{box-shadow:inset 3px 0 0 var(--cy);background:#0f1a33}.calRow.past{opacity:.6}
.calT{width:42px;flex:none;color:var(--mut)}.calImp{flex:none;width:20px;height:20px;border-radius:5px;color:#fff;font-size:calc(11px*var(--fz,1));font-weight:700;display:flex;align-items:center;justify-content:center}
.calC{width:48px;flex:none;font-size:calc(12.5px*var(--fz,1));display:flex;flex-direction:column;line-height:1.2}.calC small{color:var(--mut);font-size:calc(10px*var(--fz,1))}
.calRow small{font-size:calc(11px*var(--fz,1))}.calV{color:var(--mut)}.calV b{color:var(--tx)}
.nwGrid{display:flex;flex-direction:column}.nwBox{height:520px;margin:0 8px 8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;font-size:calc(11px*var(--fz,1));font-weight:700;letter-spacing:.14em;color:var(--mut)}
.ph::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cy);box-shadow:0 0 8px var(--cy);flex:none}
.ph::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--cy),var(--vi) 40%,transparent)}
.card{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
#tfs button.on{box-shadow:inset 0 -2px 0 var(--cy)}
table.tb{width:100%;border-collapse:collapse;font-size:calc(12.5px*var(--fz,1));font-variant-numeric:tabular-nums}
.tb th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:600;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th:nth-child(-n+4),.tb td:nth-child(-n+4){text-align:left}
.tb tbody tr{cursor:pointer}.tb tbody tr:hover{background:var(--panel2)}
.tb .x{padding:2px 9px;border:1px solid var(--line);border-radius:5px;color:var(--mut);font-size:calc(12px*var(--fz,1))}
.tb .x:hover{border-color:var(--dn);color:var(--dn)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;padding:8px 12px;font-size:calc(12.5px*var(--fz,1));border-bottom:1px solid var(--line)}
.stats span span{color:var(--mut);margin-right:6px}
@media(min-width:1000px) and (min-height:600px){
 #app{max-width:none}
 nav,#qbar,#hSym{display:none}
 #brand{display:flex;flex-direction:column;line-height:1.15;padding-right:14px;margin-right:4px;border-right:1px solid var(--line)}
 #brand b{font-size:calc(15px*var(--fz,1));letter-spacing:.22em;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
 #brand span{font-size:calc(10.5px*var(--fz,1));color:var(--mut);letter-spacing:.12em}
 #hPx{display:flex;flex:none;align-items:center}
 #hPx::before{content:attr(data-sym);font-weight:700;font-size:calc(17px*var(--fz,1));margin-right:4px}
 #acctBar{display:flex;flex:1;justify-content:flex-end;gap:22px;font-size:calc(12.5px*var(--fz,1));font-variant-numeric:tabular-nums}
 #acctBar small{display:block;color:var(--mut);font-size:calc(10px*var(--fz,1));line-height:1.1}
 #stat{max-width:260px}
 main{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) auto 240px}
 .view{position:static;inset:auto}
 #vQuotes{display:block;grid-column:1;grid-row:1/4;border-right:1px solid var(--line);background:var(--panel)}
 #vQuotes .row{padding:8px 12px}#vQuotes .row b{font-size:calc(14px*var(--fz,1))}
 #vQuotes .tag{display:none}#vQuotes .row .sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#vQuotes .row .num{flex:none}
 #vQuotes .row.cur{background:var(--panel2);box-shadow:inset 2px 0 0 var(--cy)}
 #vChart,#vChart.on{display:flex;flex-direction:column;grid-column:2;grid-row:1;overflow:hidden;min-height:0}
 #dockTabs{display:flex;grid-column:2;grid-row:2;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
 #dockTabs button{padding:7px 16px;color:var(--mut);font-size:calc(13px*var(--fz,1));font-weight:600}
 #dockTabs button.on{color:var(--tx);box-shadow:inset 0 -2px 0 var(--cy)}
 #vTrade,#vHist,#vInfo,#vNews{grid-column:2;grid-row:3;min-height:0}
 main.big{grid-template-rows:minmax(0,1fr) auto 60%}
 #vNews.on{display:flex;flex-direction:column;overflow:hidden}
 #nwBody{flex:1;min-height:0;overflow-y:auto}
 .nwGrid{flex-direction:row;flex:1;min-height:0}.nwCol{flex:1;min-width:0;display:flex;flex-direction:column}.nwBox{flex:1;height:auto;min-height:0}
 #vNews .hint{margin:0 0 6px}
 #vInfo{columns:330px;column-gap:0}#vInfo .card{break-inside:avoid;margin-top:4px}#vInfo h3{break-after:avoid}
 #side{display:block;grid-column:3;grid-row:1/4;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto}
 #ticket,#acctBox{padding:2px 12px 10px}
 #acctBox .kv{padding:3px 0;font-size:calc(13px*var(--fz,1));font-variant-numeric:tabular-nums}
 #shade{align-items:center}#sheet{max-width:470px;border-radius:12px;border:1px solid var(--line)}
 .row:active{background:none}.row{cursor:pointer}.row:hover{background:var(--panel2)}
 ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
}

html,body{overflow:hidden;height:100%;width:100%;max-width:100vw;background:var(--bg)}
#app{position:fixed;top:0;left:0;right:0;height:var(--apph,100dvh)}
#shade{bottom:auto;height:var(--apph,100dvh)}
@media(max-width:360px){header{gap:6px;padding:7px 8px}#hSym{font-size:calc(14px*var(--fz,1));padding:3px 6px}#hPx{font-size:calc(13px*var(--fz,1));gap:8px}#bell,#gear{font-size:calc(16px*var(--fz,1));padding:2px}#qbar .b{font-size:calc(13px*var(--fz,1))}#qbar .b small{font-size:calc(12px*var(--fz,1))}#tools button{padding:5px 7px;font-size:calc(12px*var(--fz,1))}}
input,select,textarea{font-size:max(16px,calc(15px*var(--fz,1)))!important}
input.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#2a3557;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0;border:0}
input.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0006}
input.sw:checked{background:linear-gradient(90deg,#0e9fb8,#6d47d9)}
input.sw:checked::before{transform:translateX(18px)}
#ctabsRow{display:flex;align-items:flex-end;background:var(--panel);flex:none}
#ctabsRow #ctabs{flex:1;min-width:0}
#tools{display:flex;gap:4px;padding:4px 6px;flex:none}
#tools button{padding:5px 9px;border:1px solid var(--line);border-radius:7px;color:var(--mut);font-size:calc(13px*var(--fz,1));font-weight:600;white-space:nowrap}
#tools button.on{color:var(--cy);border-color:var(--cy)}
#dbar{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:36px;display:none;align-items:center;gap:8px;background:#141d38f2;border:1px solid var(--cy);border-radius:20px;padding:5px 6px 5px 14px;font-size:calc(13px*var(--fz,1));z-index:3;white-space:nowrap;max-width:96%}
#dbar button{padding:5px 11px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-size:calc(12.5px*var(--fz,1))}
#dbar button.del{background:var(--sell);border-color:var(--sell);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.tgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:calc(12.5px*var(--fz,1));color:var(--tx)}
.tgrid button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.tgrid button.on{border-color:var(--cy);color:var(--cy)}
#cloudBtn{position:relative;font-size:calc(19px*var(--fz,1));padding:2px 4px;flex:none;color:var(--mut)}
#cloudBtn i{position:absolute;right:0;bottom:2px;width:8px;height:8px;border-radius:50%;background:var(--mut);border:1.5px solid var(--panel)}
#cloudBtn.ok{color:var(--cy)}#cloudBtn.ok i{background:#3fb950}#cloudBtn.wait i{background:var(--warn)}#cloudBtn.err i{background:var(--dn)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:8px;background:#fff;color:#1f1f1f;font-weight:600;border:0}
.gbtn svg{width:20px;height:20px}
#bell{position:relative;font-size:calc(18px*var(--fz,1));padding:2px 4px;flex:none}
#bell b{position:absolute;top:-5px;right:-7px;background:var(--sell);color:#fff;font-size:calc(10px*var(--fz,1));border-radius:9px;padding:0 4px;line-height:16px;min-width:16px;text-align:center}
#alerts{position:fixed;left:0;right:0;margin:0 auto;top:calc(58px + env(safe-area-inset-top));z-index:25;display:flex;flex-direction:column;gap:6px;width:min(92%,420px);pointer-events:none}
.al{pointer-events:auto;background:#101a36f7;border:1px solid var(--cy);box-shadow:0 6px 20px #0009;border-radius:10px;padding:9px 12px;font-size:calc(13px*var(--fz,1));color:var(--tx)}
.al b{display:block;font-size:calc(13.5px*var(--fz,1));margin-bottom:2px}
.ntrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.ntrow .g{flex:1;min-width:0}
.ntrow input.pin{width:64px;padding:6px;border-radius:7px;border:1px solid var(--line);background:var(--bg);outline:0;text-align:center}
#hSym{white-space:nowrap;flex:none}
#hPx{min-width:0}
#hPx{display:none}
@media(max-width:430px){header{gap:8px;padding:8px 10px}}
.sub{font-size:calc(12px*var(--fz,1));color:var(--mut);font-weight:600;margin:14px 0 2px}

/* ---- 手機橫向：K線優先 ---- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* 交易成本：sp 點差(點)、cm 手續費(美元/手，開倉時扣)、swL/swS 隔夜利息(美元/手/晚；正=收、負=付)
   群益期貨外匯保證金不收手續費，成本主要是點差；隔夜利息以群益 MT5「庫存費」為準，以下利息為估計值，可在設定修改 */
const COSTDEF={'USD/JPY':{sp:3,cm:0,swL:6,swS:-16},'EUR/USD':{sp:3,cm:0,swL:-9,swS:2},'GBP/USD':{sp:4,cm:0,swL:-4,swS:-2},'AUD/USD':{sp:3.5,cm:0,swL:-3,swS:-1},
  'USD/CHF':{sp:4,cm:0,swL:4,swS:-12},'USD/CAD':{sp:4,cm:0,swL:0.5,swS:-6},'EUR/JPY':{sp:4,cm:0,swL:3,swS:-14},'XAU/USD':{sp:4,cm:0,swL:-40,swS:15}};
const costOf=sym=>Object.assign({},COSTDEF[sym],(S.cost||{})[sym]||{});
const half=sym=>costOf(sym).sp*SYMS[sym].pip/2;
const bid=sym=>px[sym]?px[sym].mid-half(sym):null;
const ask=sym=>px[sym]?px[sym].mid+half(sym):null;
function convSym(sym){const q=sym.split('/')[1];return q==='USD'?null:'USD/'+q}
function q2usd(sym){const c=convSym(sym);if(!c)return 1;return px[c]?1/px[c].mid:null}
function pnl(p,close){const k=q2usd(p.sym);if(k==null||close==null)return null;return (p.side==='buy'?close-p.open:p.open-close)*p.lots*SYMS[p.sym].contract*k}
function marginFor(sym,lots,price){const k=q2usd(sym);if(k==null)return null;return lots*SYMS[sym].contract*price*k/S.lev}
const closePx=p=>p.side==='buy'?bid(p.sym):ask(p.sym);
const netPL=(p,c)=>{const v=pnl(p,c);return v==null?null:v+(p.swap||0)};

function rollPos(p,now){const c=costOf(p.sym),rate=p.side==='buy'?c.swL:c.swS;if(p.roll==null)p.roll=p.t;
  let d=new Date(p.roll);d.setUTCHours(21,0,0,0);if(d.getTime()<=p.roll)d=new Date(d.getTime()+864e5);let n=0;
  while(d.getTime()<=now&&n++<500){const w=d.getUTCDay();if(w>=1&&w<=5)p.swap=r2((p.swap||0)+(rate||0)*p.lots*(w===3?3:1));d=new Date(d.getTime()+864e5)}
  p.roll=now}
function rollAll(){const n=Date.now();for(const p of S.pos)rollPos(p,n)}
function openPos(sym,side,lots,price,sl,tp,t,note){
  const m=marginFor(sym,lots,price);
  if(m==null)return'缺少換算匯率，請稍候再試';
  if(acct().free<m)return'可用保證金不足（需要 '+fM(m)+'）';
  const fee=r2((costOf(sym).cm||0)*lots);if(fee)S.bal=r2(S.bal-fee);
  S.pos.push({id:S.nextId++,sym,side,lots,open:price,sl:sl||null,tp:tp||null,t,margin:m,note:note||'',fee,swap:0,roll:t});
  save();return null;
}
function closePos(p,price,t,reason){
  const i=S.pos.indexOf(p);if(i<0)return;
  rollPos(p,t);const g=pnl(p,price)||0,sw=p.swap||0,fee=p.fee||0,v=g+sw;S.pos.splice(i,1);S.bal=r2(S.bal+v);
  S.hist.unshift({id:p.id,sym:p.sym,side:p.side,lots:p.lots,open:p.open,close:price,ot:p.t,ct:t,pnl:r2(v-fee),gross:r2(g),swap:r2(sw),fee,reason});
  save();

  toast(`${p.sym} ${p.side==='buy'?'買':'賣'} ${p.lots} ${R[reason]||''}　${fM(v-fee)}`,3500);
  if(S.nt.on&&reason!=='manual')notify(`${p.sym} ${R[reason]||'已平倉'}`,`${p.side==='buy'?'買':'賣'} ${p.lots} 手，出場 ${fP(p.sym,price)}，損益 ${fM(v)}`,'cl'+p.id);
}
function checkBar(sym,b,t,off){
  const hs=half(sym);
  for(const o of S.orders.slice()){ if(o.sym!==sym)continue;
    const isBuy=o.type[0]==='b',lim=o.type.endsWith('limit'),a=isBuy?hs:-hs,lo=b.l+a,hi=b.h+a,op=b.o+a;
    let hit=false,fill=o.price;
    if(isBuy===lim){ if(lo<=o.price){hit=true;if(op<o.price)fill=op} }   // buy limit / sell stop：價格往下碰到
    else{ if(hi>=o.price){hit=true;if(op>o.price)fill=op} }              // buy stop / sell limit：價格往上碰到
    if(hit){ S.orders.splice(S.orders.indexOf(o),1);
      const e=openPos(sym,isBuy?'buy':'sell',o.lots,fill,o.sl,o.tp,t,'掛單成交');
      toast(e?`掛單 #${o.id} 觸發但未成交：${e}`:`掛單成交：${sym} ${isBuy?'買':'賣'} ${o.lots} @ ${fP(sym,fill)}`,3500);
      if(S.nt.on)notify(e?`掛單 #${o.id} 未成交`:`掛單成交：${sym}`,e||`${isBuy?'買':'賣'} ${o.lots} 手 @ ${fP(sym,fill)}`,'od'+o.id); save(); }
  }
  for(const p of S.pos.slice()){ if(p.sym!==sym||(off&&p.t>=t))continue;
    const buy=p.side==='buy',a=buy?-hs:hs,lo=b.l+a,hi=b.h+a,op=b.o+a,why=off?'off':null;
    if(buy){ if(p.sl&&lo<=p.sl)closePos(p,op<p.sl?op:p.sl,t,why||'sl'); else if(p.tp&&hi>=p.tp)closePos(p,op>p.tp?op:p.tp,t,why||'tp'); }
    else{ if(p.sl&&hi>=p.sl)closePos(p,op>p.sl?op:p.sl,t,why||'sl'); else if(p.tp&&lo<=p.tp)closePos(p,op<p.tp?op:p.tp,t,why||'tp'); }
  }
}

  const box=$('#alerts'),el=document.createElement('div');el.className='al';el.innerHTML='<b></b><span></span>';el.firstChild.textContent=title;el.lastChild.textContent=body;
  el.onclick=()=>el.remove();box.prepend(el);while(box.children.length>3)box.lastChild.remove();setTimeout(()=>el.remove(),9000);
  beep();try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(_){}
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification(title,{body,tag})}catch(_){try{navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.showNotification(title,{body,tag})).catch(()=>{})}catch(__){}}}
}
function rBell(){const n=S.nt.unread||0,b=$('#bellN');if(!b)return;b.hidden=!n;b.textContent=n>9?'9+':n;$('#bell').classList.toggle('has',!!n);$('#bell').style.opacity=S.nt.on?1:.5}
function checkAlerts(sym,mid){
  const n=S.nt;
  for(const d of (S.draw&&S.draw[sym])||[]){if(!d.al)continue;const lp=d.pts[0].p;if((d.dir==='up'&&mid>=lp)||(d.dir==='down'&&mid<=lp)){d.al=false;if(n.on)notify(`價格警報：${sym} ${d.dir==='up'?'漲到':'跌到'} ${fP(sym,lp)}`,`現價 ${fP(sym,mid)}，碰到你畫的水平線（警報已自動關閉，可再次設定）`,'hl'+d.id);else toast(`價格警報：${sym} 碰到 ${fP(sym,lp)}`,4000);save();if(sym===S.sym)requestAnimationFrame(()=>{try{draw()}catch(e){}})}}
  if(!n.on)return;const pip=SYMS[sym].pip;
  if(n.sl.on)for(const p of S.pos){if(p.sym!==sym||!p.sl)continue;const cur=p.side==='buy'?mid-half(sym):mid+half(sym),dist=(p.side==='buy'?cur-p.sl:p.sl-cur)/pip;
    if(dist>0&&dist<=n.sl.pips&&!p._warn){p._warn=1;notify(`⚠ 接近停損：${sym} ${p.side==='buy'?'買':'賣'} ${p.lots} 手`,`距離停損 ${fP(sym,p.sl)} 只剩 ${dist.toFixed(1)} 點，現價 ${fP(sym,cur)}`,'sl'+p.id)}
    else if(dist>n.sl.pips*2&&p._warn)p._warn=0}
  const m=n.mv[sym];
  if(m&&m.on&&m.pips>0){const r=n.ref[sym];if(r==null)n.ref[sym]=mid;else{const d=(mid-r)/pip;if(Math.abs(d)>=m.pips){n.ref[sym]=mid;notify(`${sym} ${d>0?'上漲':'下跌'} ${Math.abs(d).toFixed(0)} 點`,`現價 ${fP(sym,mid)}（設定：每移動 ${m.pips} 點通知一次）`,'mv'+sym)}}}
}

let spendLog=[];
function creditsLeft(){const n=Date.now();spendLog=spendLog.filter(x=>n-x<61000);return 8-spendLog.length}
function spend(k){const n=Date.now(),day=new Date().toISOString().slice(0,10);for(let i=0;i<k;i++)spendLog.push(n);if(S.credits.day!==day)S.credits={day,n:0};S.credits.n+=k;save()}
async function td(path,params,k){
  if(creditsLeft()<k){const e=new Error('每分鐘行情額度已滿，請稍候');e.rate=true;throw e}
  spend(k);
  let r;try{r=await fetch('https://api.twelvedata.com/'+path+'?'+new URLSearchParams(Object.assign({},params,{apikey:S.key})))}
  catch(_){spendLog.splice(-k,k);S.credits.n=Math.max(0,S.credits.n-k);save();const e=new Error(navigator.onLine===false?'沒有網路連線':'連不上行情');e.net=true;throw e}
  const j=await r.json();
  if(j&&(j.status==='error'||j.code>=400)){const e=new Error(j.code===401?'API 金鑰無效':j.code===429?'行情額度已用完（每分鐘 8 次／每天 800 次）':(j.message||'行情服務錯誤'));e.code=j.code;throw e}
  return j;
}

function setStatus(kind,msg){const c={ok:'#3fb950',err:'#f85149',demo:'#e3b341',closed:'#8b949e',wait:'#e3b341'}[kind];$('#dot').style.background=c;$('#statTx').textContent=msg||''}
async function fetchPrices(syms){
  if(demo())return;
  const j=await td('price',{symbol:syms.join(',')},syms.length);
  const map=syms.length===1?{[syms[0]]:j}:j;let bad=[];
  for(const s of syms){const v=map[s];if(v&&v.price!=null&&isFinite(+v.price))setPx(s,+v.price);else bad.push(s)}
  if(bad.length)toast('無法取得報價：'+bad.join('、')+'（免費方案可能不含此商品）',4000);
  if(netWarned){netWarned=false;delete $('#banner').dataset.lock}
  setStatus(marketOpen()?'ok':'closed',marketOpen()?'即時 '+new Date().toLocaleTimeString('zh-TW',{hour12:false}):'休市中');
}
function parseT(s){const m=s.match(/(\d+)-(\d+)-(\d+)(?:[ T](\d+):(\d+):(\d+))?/);return Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0))/1000}

  if(demo())return demoCandles(sym,tfSec(tf),n);
  const j=await td('time_series',{symbol:sym,interval:tf,outputsize:n,timezone:'UTC'},1);
  return (j.values||[]).map(v=>({t:parseT(v.datetime),o:+v.open,h:+v.high,l:+v.low,c:+v.close})).filter(b=>isFinite(b.c)).sort((a,b)=>a.t-b.t);
}
function demoCandles(sym,sec,n){

  for(let i=0;i<n;i++){const o=c-(Math.random()-0.5)*2*vol,h=Math.max(o,c)+Math.random()*vol*0.6,l=Math.min(o,c)-Math.random()*vol*0.6;out.unshift({t:now-i*sec,o,h,l,c});c=o}
  return out;
}
function neededSyms(){
  const s=new Set([S.sym]);S.pos.forEach(p=>s.add(p.sym));S.orders.forEach(o=>s.add(o.sym));
  if(S.nt.on)for(const k in S.nt.mv)if(S.nt.mv[k].on&&SYMS[k])s.add(k);
  for(const x of [...s]){const c=convSym(x);if(c)s.add(c)}
  return [...s];
}
let timer=null;
async function tick(){
  if(demo()){for(const s in SYMS){const m=px[s]?px[s].mid:DEMO_BASE[s];setPx(s,m+(Math.random()-0.5)*2*m*0.00008)}renderLive();return}
  if(document.hidden&&!(S.nt.on&&S.nt.bg))return;

}

  clearTimeout(timer);let iv;

let loadSeq=0,lastResync=0;
async function loadChart(force){
  const key=S.sym+'|'+S.tf,c=cache[key],seq=++loadSeq;
  C.data=c?c.bars:[];recompute();draw();
  if(!force&&c&&Date.now()-c.at<Math.max(60000,tfSec(S.tf)*500))return;

  }catch(e){if(e.net)netHelp();if(seq===loadSeq){C.msg=e.message;draw()}setStatus(e.rate?'wait':'err',e.message)}

function liveCandle(mid,t,quiet){
  const d=C.data;if(!d.length)return;const sec=tfSec(S.tf),last=d[d.length-1],now=t/1000;
  if(sec<86400&&now>=last.t+sec){
    const nt=last.t+Math.floor((now-last.t)/sec)*sec;d.push({t:nt,o:mid,h:mid,l:mid,c:mid});
    if(!demo()&&Date.now()-lastResync>300000){lastResync=Date.now();resync()}

async function resync(){ // 用真實K線修正最近幾根（輪詢取樣會漏掉高低點）
  try{const key=S.sym+'|'+S.tf,bars=await getSeries(S.sym,S.tf,5),d=cache[key]&&cache[key].bars;if(!d)return;
    for(const b of bars){const i=d.findIndex(x=>x.t===b.t);if(i>=0)d[i]=b;else if(b.t>d[d.length-1].t)d.push(b)}
    recompute();draw()}catch(e){}
}
async function catchUp(){ // 重新開啟時，用離線期間的真實K線檢查停損/停利/掛單
  if(demo())return;
  const syms=[...new Set([...S.pos.filter(p=>p.sl||p.tp).map(p=>p.sym),...S.orders.map(o=>o.sym)])];
  for(const sym of syms){const ls=S.lastSeen[sym];if(!ls)continue;const gap=(Date.now()-ls)/60000;if(gap<3)continue;
    const big=gap>4900,tf=big?'15min':'1min',n=Math.min(5000,Math.ceil(gap/(big?15:1))+3);
    try{const bars=await getSeries(sym,tf,n);for(const b of bars)if(b.t*1000>ls)checkBar(sym,b,b.t*1000,true)}catch(e){}
  }
}

  const tri=(cx,cy,buy)=>{x.fillStyle=buy?'#2f7de1':'#e0473f';x.beginPath();if(buy){x.moveTo(cx,cy+2);x.lineTo(cx-6,cy+12);x.lineTo(cx+6,cy+12)}else{x.moveTo(cx,cy-2);x.lineTo(cx-6,cy-12);x.lineTo(cx+6,cy-12)}x.closePath();x.fill()};
  for(const h of S.hist){if(h.sym!==sym)continue;const xa=xOfT(h.ot/1000),xb=xOfT(h.ct/1000);if(xb<-20||xa>pw+20)continue;const ya=Y(h.open),yb=Y(h.close);
    x.strokeStyle=h.pnl>=0?'#3fb950bb':'#ef5350bb';x.setLineDash([4,3]);x.beginPath();x.moveTo(xa,ya);x.lineTo(xb,yb);x.stroke();x.setLineDash([]);
    tri(xa,ya,h.side==='buy');x.fillStyle='#070b18';x.strokeStyle=h.pnl>=0?'#3fb950':'#ef5350';x.lineWidth=2;x.beginPath();x.arc(xb,yb,4,0,7);x.fill();x.stroke();x.lineWidth=1}
  for(const p of S.pos)if(p.sym===sym)tri(xOfT(p.t/1000),Y(p.open),p.side==='buy');
}

(function gestures(){
  const cv=C.cv,pts=new Map();let drag=null,pinch=null,lp=null,crossMode=false,tap=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const clampOff=()=>{const vis=(C.w-62*fz())/C.barW;C.off=Math.max(-vis*0.5,Math.min(C.data.length-5,C.off))};
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);pts.set(e.pointerId,p);
    if(pts.size===1){tap={x:p.x,y:p.y,t:Date.now(),id:e.pointerId};drag={x:p.x,off:C.off};if(e.pointerType!=='mouse')lp=setTimeout(()=>{crossMode=true;tap=null;C.cross=p;draw()},tool?600:350)}
    else if(pts.size===2){tap=null;clearTimeout(lp);crossMode=false;C.cross=null;const[a,b]=[...pts.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y)||1,barW:C.barW};drag=null}});
  cv.addEventListener('pointermove',e=>{const p=pos(e);
    if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){C.cross=p;draw()}return}
    pts.set(e.pointerId,p);if(tap&&Math.hypot(p.x-tap.x,p.y-tap.y)>7)tap=null;
    if(pts.size===2&&pinch){const[a,b]=[...pts.values()];C.barW=Math.max(2,Math.min(40,pinch.barW*Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist));clampOff();draw();return}
    if(crossMode){C.cross=p;draw();return}
    if(drag){const dx=p.x-drag.x;if(Math.abs(dx)>5)clearTimeout(lp);C.off=drag.off+dx/C.barW;clampOff();if(e.pointerType==='mouse')C.cross=p;draw()}});
  const end=e=>{if(e.type==='pointerup'&&tap&&tap.id===e.pointerId&&pts.size===1&&!crossMode&&Date.now()-tap.t<500){const q=tap;tap=null;pts.delete(e.pointerId);clearTimeout(lp);drag=null;onTap(q.x,q.y);if(e.pointerType!=='mouse'){C.cross=null;draw()}return}tap=null;pts.delete(e.pointerId);clearTimeout(lp);if(pts.size<2)pinch=null;if(pts.size===0){drag=null;if(crossMode||e.pointerType!=='mouse'){crossMode=false;C.cross=null;draw()}}else{const p=[...pts.values()][0];drag={x:p.x,off:C.off}}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!pts.size){C.cross=null;draw()}});
  cv.addEventListener('wheel',e=>{e.preventDefault();C.barW=Math.max(2,Math.min(40,C.barW*(e.deltaY<0?1.12:0.89)));clampOff();draw()},{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  new ResizeObserver(resize).observe($('#cwrap'));
  $('#goLive').onclick=()=>{C.off=0;draw()};
  setInterval(()=>{if(!document.hidden&&(view==='vChart'||desk())&&!C.cross)draw()},1000);
})();

function calZh(t0){let t=t0.trim();if(CAL_DICT[t])return CAL_DICT[t];
  let m=t.match(/^(FOMC|Fed|ECB|BOE|BOJ|RBA|BOC|SNB|RBNZ|PBOC)\s+(Deputy Gov|Vice Chair|Chairman|Chair|Governor|Gov|President|Member)\s+(.+?)\s+Speaks$/);if(m)return`${CB[m[1]]}${ROLE[m[2]]} ${m[3]} 談話`;
  m=t.match(/^(.+?)\s+Speaks$/);if(m)return`${m[1]} 談話`;
  let pre='';const tags=[];for(const[x,z]of CAL_SUF)if(t.endsWith(x)){t=t.slice(0,-x.length);tags.push(z.slice(1,-1));break}
  for(const[p,z]of CAL_PFX)if(t.startsWith(p)){t=t.slice(p.length);pre=z;break}
  for(let k=0;k<2;k++)for(const[p,z]of CAL_MOD)if(t.startsWith(p)){t=t.slice(p.length);tags.push(z.slice(1,-1))}
  let core=CAL_DICT[t];if(!core&&t.startsWith('Core ')&&CAL_DICT[t.slice(5)])core='核心'+CAL_DICT[t.slice(5)].replace(/（(CPI|PPI|PCE)）/,'');
  if(!core)return null;if(tags.length)core=core.replace(/（([A-Z]{2,5})）$/,' $1');if(pre&&/^[A-Za-z]/.test(core))pre+=' ';
  return pre+core+(tags.length?`（${tags.join('，')}）`:'')}

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},k,256))}

  const ok=S.sec&&await pinHash(pin,S.sec.salt)===S.sec.h;if(ok)pinFails=0;else if(++pinFails>=5){pinFails=0;pinWait=Date.now()+30e3}return ok}

  pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});return b64(c.rawId)}

  const go=async()=>{const v=$('#pinIn').value.trim();if(!/^\d{4,8}$/.test(v)){$('#pinErr').textContent='請輸入 4～8 位數字';return}$('#pinOk').disabled=true;

let insetProbe=null;
function safeTop(){try{if(!insetProbe){insetProbe=document.createElement('div');insetProbe.style.cssText='position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top);visibility:hidden;pointer-events:none';document.body.appendChild(insetProbe)}return insetProbe.getBoundingClientRect().height}catch(_){return 0}}
function screenDiag(){const land=innerWidth>innerHeight,sh=window.screen?(land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height)):0,top=safeTop();
  return{sw:innerWidth,sh,vh:innerHeight,top,bug:standalone()&&top>0&&sh>innerHeight&&Math.abs(sh-innerHeight-top)<=6}}

function applyPad(){const r=document.documentElement.style,ui=S.ui||(S.ui={padT:null,padB:null}),dg=screenDiag(),gap=standalone()?dg.sh-dg.vh:0;
  if(ui.padT!=null)r.setProperty('--padTop',ui.padT+'px');else r.removeProperty('--padTop');
  // iPhone 主畫面 App 底部若已被系統留白（gap），導覽列就不再重複加 home 鍵的安全距離
  if(ui.padB!=null)r.setProperty('--navPB',ui.padB+'px');else if(gap>=30&&gap<=140)r.setProperty('--navPB','4px');else r.removeProperty('--navPB')}
function fitApp(){const a=document.activeElement;if(a&&a.matches&&a.matches('input,select,textarea'))return;

  const cur=document.documentElement.style.getPropertyValue('--apph');if(cur!==h+'px')document.documentElement.style.setProperty('--apph',h+'px');
  applyPad();requestAnimationFrame(resize)}

// 1) 取得授權：一般瀏覽器用彈出視窗；iPhone 主畫面 App 用整頁跳轉（彈出視窗在那裡不穩）
function gLogin(){if(!gcid())return toast('請先在設定填入 Google 用戶端 ID',3500);
  if(iosApp()){const st=Math.random().toString(36).slice(2);sessionStorage.setItem('g_state',st);
    const q=new URLSearchParams({client_id:gcid(),redirect_uri:location.origin+location.pathname,response_type:'token',scope:GSCOPE,include_granted_scopes:'true',state:st,prompt:S.cloud&&S.cloud.email?'':'select_account'});

  if(!(window.google&&google.accounts&&google.accounts.oauth2)){loadGIS().catch(e=>toast(e.message));return toast('Google 登入元件載入中，請再按一次',3000)}
  gClient=google.accounts.oauth2.initTokenClient({client_id:gcid(),scope:GSCOPE,hint:S.cloud&&S.cloud.email||undefined,
    callback:r=>{if(r.error){setCloud('err','登入失敗：'+r.error);return}gTok=r.access_token;gExp=Date.now()+(+r.expires_in-120)*1000;try{sessionStorage.setItem('g_tok',JSON.stringify([gTok,gExp]))}catch(_){}cloudConnect()},

function gTakeRedirect(){const h=location.hash;if(!h||!h.includes('access_token='))return false;const p=new URLSearchParams(h.slice(1));history.replaceState(null,'',location.pathname);
  if(p.get('state')!==sessionStorage.getItem('g_state')){toast('登入驗證失敗，請重試');return false}
  gTok=p.get('access_token');gExp=Date.now()+(+p.get('expires_in')-120)*1000;try{sessionStorage.setItem('g_tok',JSON.stringify([gTok,gExp]))}catch(_){}return true}
async function gFetch(url,opt={}){if(!tokOK()){setCloud('wait','雲端連線已逾時，點 ☁ 重新連線');throw new Error('需要重新連線')}
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+gTok},opt.headers||{})}));
  if(r.status===401){gTok=null;setCloud('wait','雲端連線已逾時，點 ☁ 重新連線');throw new Error('需要重新連線')}
  if(!r.ok)throw new Error('雲端錯誤 '+r.status);return r}

  return(await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp})).json()}

function snapHash(o){const t=JSON.stringify(o,(k,v)=>['roll','lastSeen','ref','unread'].includes(k)?undefined:v);let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h+':'+t.length}
function summary(d){return`餘額 ${fM(d.bal||0)}・持倉 ${(d.pos||[]).length} 筆・紀錄 ${(d.hist||[]).filter(h=>h.sym).length} 筆`}
async function cloudPush(){const d=snapData(),h=snapHash(d),at=Date.now();setCloud('wait','上傳中…');
  const r=await dPut(S.cloud.fileId,{v:1,at,device:navigator.userAgent.slice(0,80),data:d});S.cloud.fileId=r.id||S.cloud.fileId;S.cloud.at=at;S.cloud.hash=h;S.cloud.pending=false;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}setCloud('ok','已同步 '+fT(at))}
function cloudPull(remote){const keep={ui:S.ui,fz:S.fz,credits:S.credits,cloud:Object.assign({},S.cloud,{at:remote.at,hash:snapHash(remote.data),auto:true,pending:false})};
  const n=Object.assign({},remote.data,keep);toast('已同步雲端資料，重新載入中…');setTimeout(()=>loadAll(n),500)}
async function cloudConnect(){
  try{setCloud('wait','連線雲端中…');
    const email=(await (await gFetch('https://www.googleapis.com/oauth2/v3/userinfo')).json()).email||'';
    if(sessionStorage.getItem('pinReset')){sessionStorage.removeItem('pinReset');setCloud('ok','已連線');pinResetByGoogle(email);return}
    const f=await dFind(),same=S.cloud&&S.cloud.email===email&&S.cloud.auto;
    if(!f){S.cloud={email,fileId:null,at:0,auto:true};await cloudPush();toast('已綁定 '+email+'，這台的資料已上傳雲端',4000);return}
    const remote=await dGet(f.id);S.cloud=Object.assign(S.cloud&&S.cloud.email===email?S.cloud:{at:0,auto:false},{email,fileId:f.id});save();
    const localChanged=snapHash(snapData())!==S.cloud.hash;
    if(same&&remote.at===S.cloud.at){if(localChanged)await cloudPush();else setCloud('ok','已同步 '+fT(remote.at));return}
    if(same&&remote.at>S.cloud.at&&!localChanged){cloudPull(remote);return}
    askSync(remote,same)}
  catch(e){setCloud(tokOK()?'err':'wait',e.message)}}
function askSync(remote,conflict){
  sheet(head(conflict?'雲端與這台都有變更':'要同步雲端資料嗎？')+`<p style="margin:2px 0 10px">${conflict?'這台裝置和雲端的資料在上次同步後都改過了，請選擇要保留哪一份。':`你的 Google 帳號（${esc(S.cloud.email)}）已經有雲端資料。`}</p>
   <div class="card" style="margin:0 0 8px"><b>雲端資料</b><div class="sm mut">${fT(remote.at)} 上傳</div><div class="sm">${summary(remote.data)}</div></div>
   <div class="card" style="margin:0 0 12px"><b>這台裝置</b><div class="sm">${summary(S)}</div></div>
   <button class="btn brand full" id="syPull">同意同步：使用雲端資料（取代這台）</button>
   <button class="btn full" id="syPush" style="margin-top:8px">保留這台：上傳並覆蓋雲端</button>
   <button class="btn full" id="syNo" style="margin-top:8px">暫不同步</button>
   <p class="hint">同步後，在這台的交易、設定會自動上傳；換到其他手機或電腦登入同一個 Google 帳號，就會詢問是否同步。畫面校正和字體大小每台裝置各自保留。</p>`);
  $('#syPull').onclick=()=>cloudPull(remote);
  let armed=false;$('#syPush').onclick=async()=>{if(!armed){armed=true;$('#syPush').textContent='確定覆蓋雲端？再按一次';$('#syPush').className='btn red full';return}S.cloud.auto=true;closeSheet();try{await cloudPush();toast('已用這台的資料覆蓋雲端')}catch(e){setCloud('err',e.message)}};
  $('#syNo').onclick=()=>{S.cloud.auto=false;save();closeSheet();setCloud('wait','已登入，未同步')}}
// 本機有變更時，15 秒後自動上傳（只在已同意同步、連線有效時）
window.cloudTouch=()=>{if(!S.cloud||!S.cloud.auto||!S.cloud.email)return;if(snapHash(snapData())===S.cloud.hash)return;
  if(!tokOK()){if(!S.cloud.pending){S.cloud.pending=true;setCloud('wait','有尚未上傳的變更，點 ☁ 連線同步')}return}
  if(pushT)return;pushT=setTimeout(()=>{pushT=null;if(snapHash(snapData())!==S.cloud.hash)cloudPush().catch(e=>setCloud('err',e.message))},15000)};
function cloudLogout(){if(gTok&&window.google&&google.accounts&&google.accounts.oauth2)try{google.accounts.oauth2.revoke(gTok,()=>{})}catch(_){}
  gTok=null;S.cloud=null;save();setCloud('off','');toast('已解除 Google 綁定（雲端上的資料保留）')}
function rCloudBox(){const b=$('#cloudBox');if(!b)return;const c=S.cloud,g='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
  b.innerHTML=(!gcid()?`<p class="hint">要先申請一組 Google「用戶端 ID」（免費，只需做一次），步驟請看 Claude 提供的說明。</p><label class="f"><span>Google 用戶端 ID</span><input id="gcidIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxxxxx.apps.googleusercontent.com"></label><button class="btn full" id="gcidSave">儲存用戶端 ID</button>`
   :c&&c.email?`<p class="sm">已綁定 <b>${esc(c.email)}</b><br><span class="mut">${cloudMsg||(c.auto?'自動同步：開':'尚未同步')}${c.at?'・上次同步 '+fT(c.at):''}</span></p><div class="two"><button class="btn brand" id="cSync">${tokOK()?'立即同步':'連線並同步'}</button><button class="btn" id="cOut">解除綁定</button></div>`
   :`<button class="gbtn" id="cIn">${g}使用 Google 帳號登入並同步</button><p class="hint">資料會存到你自己的 Google 雲端硬碟（應用程式專用空間，不會出現在你的檔案清單裡，其他 App 也讀不到）。${cloudMsg?'<br><span class="dn">'+esc(cloudMsg)+'</span>':''}</p>`);
  const q=x=>b.querySelector(x);if(q('#cIn'))q('#cIn').onclick=gLogin;if(q('#cSync'))q('#cSync').onclick=()=>tokOK()?cloudConnect():gLogin();
  if(q('#cOut')){let armed=false;q('#cOut').onclick=()=>{if(!armed){armed=true;q('#cOut').textContent='確定解除？';return}cloudLogout()}}
  if(q('#gcidSave'))q('#gcidSave').onclick=()=>{const v=q('#gcidIn').value.trim();if(!/apps\.googleusercontent\.com$/.test(v))return toast('格式不對，應以 .apps.googleusercontent.com 結尾',3500);S.gcid=v;save();loadGIS().catch(()=>{});rCloudBox();setCloud('off','')}}
$('#cloudBtn').onclick=()=>{if(tokOK())cloudConnect();else gLogin()};
function cloudInit(){
  try{const t=JSON.parse(sessionStorage.getItem('g_tok')||'null');if(t&&Date.now()<t[1]){gTok=t[0];gExp=t[1]}}catch(_){}
  const back=gTakeRedirect();if(gcid()&&!iosApp())loadGIS().catch(()=>{});
  setCloud(S.cloud&&S.cloud.email?(S.cloud.auto?'wait':'off'):'off',S.cloud&&S.cloud.email?'點 ☁ 連線同步':'');
  if(back||tokOK())cloudConnect()}

/* ================= 啟動 ================= */
window.__fx={get S(){return S},rollPos,px,C,I,setPx,openPos,closePos,checkBar,acct,pnl,marginFor,bid,ask};
(async function init(){
  if(demo()){for(const s in SYMS)if(!px[s])px[s]={mid:DEMO_BASE[s],t:Date.now()}}
  const layout=()=>{O={};$('#ticket').innerHTML='';if($('#shade').classList.contains('on'))closeSheet();if(desk())orderSheet('buy',$('#ticket'));go(desk()?'vTrade':'vChart');renderLive()};
  mq.addEventListener('change',layout);lq.addEventListener('change',()=>{renderLive();setTimeout(()=>{fitApp();resize()},80)});
  i18nInit();consentGate();{const w=$('#wmTx');if(w)w.textContent=DL().short}renderTabs();renderTfs();layout();rBell();cloudInit();
  if(!demo())setStatus('wait','連線中…');
  await loadChart();
  await catchUp();
  await tick();schedule();
})();
</script>
