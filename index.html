<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b18">
<title>HAIYI｜駭異科技.FX</title>
<style>
:root{--bg:#070b18;--panel:#0c1326;--panel2:#141d38;--line:#1e2a4c;--tx:#e8ecf8;--mut:#8491b4;--cy:#22d3ee;--vi:#8b5cf6;--up:#26a69a;--dn:#ef5350;--buy:#2f7de1;--sell:#e0473f;--warn:#e3b341}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:900px;margin:0 auto;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid;border-image:linear-gradient(90deg,var(--cy),var(--vi) 45%,var(--line) 80%) 1;background:var(--panel)}
#hSym{font-weight:700;font-size:16px;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
#hPx{flex:1;display:flex;gap:12px;font-variant-numeric:tabular-nums;font-size:15px}
#hPx small{color:var(--mut);font-size:10px;display:block;line-height:1}
#stat{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;max-width:150px;text-align:right;min-width:0}
#statTx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
#gear{font-size:20px;padding:2px 6px}
#banner{display:none;background:#3a2f0b;color:var(--warn);font-size:12px;padding:5px 12px;text-align:center}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#vChart.on{display:flex;flex-direction:column;overflow:hidden}
#tfs{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
#tfs button{padding:5px 9px;border-radius:5px;color:var(--mut);font-size:13px;white-space:nowrap}
#tfs button.on{background:var(--panel2);color:var(--tx);font-weight:600}
#tfs .sp{flex:1}
#cwrap{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#qbar{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);flex:none;align-items:stretch}
#qbar .b{flex:1;border-radius:8px;padding:6px 4px;color:#fff;font-weight:700;line-height:1.2}
#qbar .b small{display:block;font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.sellbg{background:var(--sell)}.buybg{background:var(--buy)}
#lotBox{display:flex;align-items:center;background:var(--panel2);border-radius:8px;border:1px solid var(--line)}
#lotBox button{width:32px;height:100%;font-size:18px;color:var(--mut)}
#lotBox input{width:52px;text-align:center;background:none;border:0;outline:0;font-variant-numeric:tabular-nums}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;min-width:0;padding:8px 0 7px;color:var(--mut);font-size:11px}
nav button i{display:block;font-style:normal;font-size:18px;line-height:1.2}
nav button.on{color:var(--cy)}
.row{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);gap:10px}
.row:active{background:var(--panel)}
.row .g{flex:1;min-width:0}
.row b{font-size:15px}
.mut{color:var(--mut)}.sm{font-size:12px}.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.cb{color:#58a6ff}.cs{color:#ff7b72}
.card{margin:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv span:first-child{color:var(--mut)}
h3{margin:14px 14px 4px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.05em}
.btn{padding:10px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--buy);border-color:var(--buy);color:#fff}
.btn.brand{background:linear-gradient(90deg,#0e9fb8,#6d47d9);border:0;color:#fff}
.btn.red{background:var(--sell);border-color:var(--sell);color:#fff}
.btn.full{width:100%}
.empty{padding:28px 14px;text-align:center;color:var(--mut)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
#shade.on{display:flex}
#sheet{background:var(--panel);width:100%;max-width:900px;max-height:88dvh;overflow-y:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{font-size:22px;color:var(--mut);padding:0 6px}
label.f{display:block;margin:8px 0}
label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
label.f input,label.f select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:16px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.seg button{flex:1;padding:9px 4px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--tx)}
.seg button.on.s{background:var(--sell);color:#fff}.seg button.on.b{background:var(--buy);color:#fff}
.err{color:var(--dn);font-size:13px;min-height:18px;margin:6px 0}
.hint{font-size:12px;color:var(--mut);margin:6px 0}
.two{display:flex;gap:8px}.two>*{flex:1}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:#30363d;border:1px solid #484f58;padding:9px 14px;border-radius:8px;z-index:20;display:none;max-width:88%;font-size:13px;text-align:center}
.chk{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px}
a{color:var(--cy)}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--mut);margin-left:6px}

/* ---- HAIYI 品牌元素 ---- */
#brand,#acctBar,#side,#dockTabs{display:none}
#ctabs{display:flex;gap:2px;padding:4px 6px 0;overflow-x:auto;flex:none;background:var(--panel)}
#ctabs button{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;color:var(--mut);font-size:13px;font-weight:600;white-space:nowrap}
#ctabs button small{font-weight:500;font-size:11px;opacity:.8}
#ctabs button.on{background:var(--bg);color:var(--tx);box-shadow:inset 0 2px 0 var(--cy)}
#ctabs i{font-style:normal;color:var(--mut);padding:0 2px;border-radius:4px}#ctabs i:hover{color:var(--dn)}
#ctabs #tabAdd{border-style:dashed;padding:6px 12px}
.irow{display:flex;align-items:flex-end;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.irow>input[type=checkbox]{width:20px;height:20px;margin:0 0 9px;flex:none}
.irow>b{width:92px;flex:none;padding-bottom:9px;font-size:13.5px}
.irow label{flex:1;min-width:0}.irow label span{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.irow label input,.irow label select{width:100%;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:15px}
.nwBar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 12px}
.nwBar .seg{margin:0;flex:1;min-width:260px;max-width:420px}.nwBar .seg button{padding:6px 4px;font-size:13px}
.nwLinks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.nwGrid{display:flex;flex-direction:column}.nwBox{height:520px;margin:0 8px 8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mut)}
.ph::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cy);box-shadow:0 0 8px var(--cy);flex:none}
.ph::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--cy),var(--vi) 40%,transparent)}
.card{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
#tfs button.on{box-shadow:inset 0 -2px 0 var(--cy)}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tb th{position:sticky;top:0;background:var(--panel);color:var(--mut);font-weight:600;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th:nth-child(-n+4),.tb td:nth-child(-n+4){text-align:left}
.tb tbody tr{cursor:pointer}.tb tbody tr:hover{background:var(--panel2)}
.tb .x{padding:2px 9px;border:1px solid var(--line);border-radius:5px;color:var(--mut);font-size:12px}
.tb .x:hover{border-color:var(--dn);color:var(--dn)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.stats span span{color:var(--mut);margin-right:6px}
@media(min-width:1000px){
 #app{max-width:none}
 nav,#qbar,#hSym{display:none}
 #brand{display:flex;flex-direction:column;line-height:1.15;padding-right:14px;margin-right:4px;border-right:1px solid var(--line)}
 #brand b{font-size:15px;letter-spacing:.22em;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
 #brand span{font-size:10.5px;color:var(--mut);letter-spacing:.12em}
 #hPx{flex:none;align-items:center}
 #hPx::before{content:attr(data-sym);font-weight:700;font-size:17px;margin-right:4px}
 #acctBar{display:flex;flex:1;justify-content:flex-end;gap:22px;font-size:12.5px;font-variant-numeric:tabular-nums}
 #acctBar small{display:block;color:var(--mut);font-size:10px;line-height:1.1}
 #stat{max-width:260px}
 main{display:grid;grid-template-columns:270px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) auto 240px}
 .view{position:static;inset:auto}
 #vQuotes{display:block;grid-column:1;grid-row:1/4;border-right:1px solid var(--line);background:var(--panel)}
 #vQuotes .row{padding:8px 12px}#vQuotes .row b{font-size:14px}
 #vQuotes .tag{display:none}#vQuotes .row .sm{white-space:nowrap}
 #vQuotes .row.cur{background:var(--panel2);box-shadow:inset 2px 0 0 var(--cy)}
 #vChart,#vChart.on{display:flex;flex-direction:column;grid-column:2;grid-row:1;overflow:hidden;min-height:0}
 #dockTabs{display:flex;grid-column:2;grid-row:2;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
 #dockTabs button{padding:7px 16px;color:var(--mut);font-size:13px;font-weight:600}
 #dockTabs button.on{color:var(--tx);box-shadow:inset 0 -2px 0 var(--cy)}
 #vTrade,#vHist,#vInfo,#vNews{grid-column:2;grid-row:3;min-height:0}
 main.big{grid-template-rows:minmax(0,1fr) auto 60%}
 #vNews.on{display:flex;flex-direction:column;overflow:hidden}
 .nwGrid{flex-direction:row;flex:1;min-height:0}.nwCol{flex:1;min-width:0;display:flex;flex-direction:column}.nwBox{flex:1;height:auto;min-height:0}
 #vNews .hint{margin:0 0 6px}
 #vInfo{columns:330px;column-gap:0}#vInfo .card{break-inside:avoid;margin-top:4px}#vInfo h3{break-after:avoid}
 #side{display:block;grid-column:3;grid-row:1/4;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto}
 #ticket,#acctBox{padding:2px 12px 10px}
 #acctBox .kv{padding:3px 0;font-size:13px;font-variant-numeric:tabular-nums}
 #shade{align-items:center}#sheet{max-width:470px;border-radius:12px;border:1px solid var(--line)}
 .row:active{background:none}.row{cursor:pointer}.row:hover{background:var(--panel2)}
 ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="brand"><b>HAIYI</b><span>駭異科技.FX</span></div>
    <button id="hSym"></button>
    <div id="hPx"><div><small>賣出 Bid</small><span id="hBid" class="num">—</span></div><div><small>買入 Ask</small><span id="hAsk" class="num">—</span></div></div>
    <div id="acctBar"></div>
    <div id="stat"><span id="statTx"></span><span id="dot"></span></div>
    <button id="gear" aria-label="設定">⚙</button>
  </header>
  <div id="banner"></div>
  <main>
    <section class="view" id="vQuotes"></section>
    <section class="view" id="vChart">
      <div id="ctabs"></div>
      <div id="tfs"></div>
      <div id="cwrap"><canvas id="cv"></canvas></div>
      <div id="qbar">
        <button class="b sellbg" id="qSell">賣出 SELL<small id="qBid">—</small></button>
        <div id="lotBox"><button id="lotM">−</button><input id="lotIn" inputmode="decimal" aria-label="手數"><button id="lotP">＋</button></div>
        <button class="b buybg" id="qBuy">買入 BUY<small id="qAsk">—</small></button>
      </div>
    </section>
    <section class="view" id="vTrade"></section>
    <section class="view" id="vHist"></section>
    <section class="view" id="vInfo"></section>
    <section class="view" id="vNews"></section>
    <div id="dockTabs"></div>
    <aside id="side"><div class="ph">下單 ORDER</div><div id="ticket"></div><div class="ph">帳戶 ACCOUNT</div><div id="acctBox"></div></aside>
  </main>
  <nav id="nav"></nav>
</div>
<div id="shade"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= 基本設定 ================= */
const SYMS={
 'USD/JPY':{d:3,pip:0.01,spread:1.4,contract:100000,name:'美元/日圓'},
 'EUR/USD':{d:5,pip:0.0001,spread:1.0,contract:100000,name:'歐元/美元'},
 'GBP/USD':{d:5,pip:0.0001,spread:1.5,contract:100000,name:'英鎊/美元'},
 'AUD/USD':{d:5,pip:0.0001,spread:1.2,contract:100000,name:'澳幣/美元'},
 'USD/CHF':{d:5,pip:0.0001,spread:1.5,contract:100000,name:'美元/瑞郎'},
 'USD/CAD':{d:5,pip:0.0001,spread:1.6,contract:100000,name:'美元/加幣'},
 'EUR/JPY':{d:3,pip:0.01,spread:2.0,contract:100000,name:'歐元/日圓'},
 'XAU/USD':{d:2,pip:0.1,spread:3.0,contract:100,name:'黃金/美元'}
};
const TFS=[['1min','M1',60],['5min','M5',300],['15min','M15',900],['30min','M30',1800],['1h','H1',3600],['4h','H4',14400],['1day','D1',86400],['1week','W1',604800]];
const tfSec=tf=>TFS.find(t=>t[0]===tf)[2], tfName=tf=>TFS.find(t=>t[0]===tf)[1];
const DEMO_BASE={'USD/JPY':152.4,'EUR/USD':1.085,'GBP/USD':1.27,'AUD/USD':0.655,'USD/CHF':0.885,'USD/CAD':1.37,'EUR/JPY':165.3,'XAU/USD':2650};
const KEY='fxp1';
const DEF={v:1,key:'',interval:30,lev:100,bal:10000,pos:[],orders:[],hist:[],nextId:1,sym:'USD/JPY',tf:'15min',
  ic:{ma:[{on:true,n:20,t:'SMA'},{on:false,n:60,t:'SMA'},{on:false,n:120,t:'EMA'}],bb:{on:false,n:20,k:2},rsi:{on:false,n:14},macd:{on:false,f:12,s:26,g:9},kd:{on:false,n:9,k:3,d:3}},tabs:null,tab:0,upRed:false,lots:0.1,lastSeen:{},credits:{day:'',n:0},px:{}};
let S=load();
function load(){let o=JSON.parse(JSON.stringify(DEF));try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1){const ic=o.ic;o=Object.assign(o,j);
    if(!j.ic){o.ic=ic;if(j.ind){ic.ma[0].on=!!j.ind.ma20;ic.ma[1].on=!!j.ind.ma60;ic.bb.on=!!j.ind.bb;ic.rsi.on=!!j.ind.rsi;ic.macd.on=!!j.ind.macd}}
    else for(const k in ic)if(!o.ic[k])o.ic[k]=ic[k];delete o.ind}}catch(e){}
  if(!Array.isArray(o.tabs)||!o.tabs.length){o.tabs=[{sym:o.sym,tf:o.tf}];o.tab=0}if(!o.tabs[o.tab])o.tab=0;o.sym=o.tabs[o.tab].sym;o.tf=o.tabs[o.tab].tf;return o}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150)}
const px=S.px;                 // {sym:{mid,t}}
const cache={};                // 'sym|tf' -> {bars,at}
const $=s=>document.querySelector(s);
const demo=()=>!S.key;
const fP=(sym,v)=>v==null||!isFinite(v)?'—':v.toFixed(SYMS[sym].d);
const fM=v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fT=ms=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0');return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const r2=v=>Math.round(v*100)/100;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms||2600)}

/* ================= 價格與帳戶計算 ================= */
const half=sym=>SYMS[sym].spread*SYMS[sym].pip/2;
const bid=sym=>px[sym]?px[sym].mid-half(sym):null;
const ask=sym=>px[sym]?px[sym].mid+half(sym):null;
function convSym(sym){const q=sym.split('/')[1];return q==='USD'?null:'USD/'+q}
function q2usd(sym){const c=convSym(sym);if(!c)return 1;return px[c]?1/px[c].mid:null}
function pnl(p,close){const k=q2usd(p.sym);if(k==null||close==null)return null;return (p.side==='buy'?close-p.open:p.open-close)*p.lots*SYMS[p.sym].contract*k}
function marginFor(sym,lots,price){const k=q2usd(sym);if(k==null)return null;return lots*SYMS[sym].contract*price*k/S.lev}
const closePx=p=>p.side==='buy'?bid(p.sym):ask(p.sym);
function acct(){let fl=0,mg=0;for(const p of S.pos){fl+=pnl(p,closePx(p))||0;mg+=p.margin}const eq=S.bal+fl;return{fl,mg,eq,free:eq-mg,lvl:mg?eq/mg*100:null}}
function marketOpen(){if(demo())return true;const d=new Date(),w=d.getUTCDay(),h=d.getUTCHours();return!(w===6||(w===5&&h>=22)||(w===0&&h<22))}

/* ================= 交易引擎 ================= */
function openPos(sym,side,lots,price,sl,tp,t,note){
  const m=marginFor(sym,lots,price);
  if(m==null)return'缺少換算匯率，請稍候再試';
  if(acct().free<m)return'可用保證金不足（需要 '+fM(m)+'）';
  S.pos.push({id:S.nextId++,sym,side,lots,open:price,sl:sl||null,tp:tp||null,t,margin:m,note:note||''});
  save();return null;
}
function closePos(p,price,t,reason){
  const i=S.pos.indexOf(p);if(i<0)return;
  const v=pnl(p,price)||0;S.pos.splice(i,1);S.bal=r2(S.bal+v);
  S.hist.unshift({id:p.id,sym:p.sym,side:p.side,lots:p.lots,open:p.open,close:price,ot:p.t,ct:t,pnl:r2(v),reason});
  save();
  const R={sl:'停損觸發',tp:'停利觸發',so:'保證金不足，強制平倉',manual:'已平倉',off:'離線期間觸發'};
  toast(`${p.sym} ${p.side==='buy'?'買':'賣'} ${p.lots} ${R[reason]||''}　${fM(v)}`,3500);
}
function checkBar(sym,b,t,off){
  const hs=half(sym);
  for(const o of S.orders.slice()){ if(o.sym!==sym)continue;
    const isBuy=o.type[0]==='b',lim=o.type.endsWith('limit'),a=isBuy?hs:-hs,lo=b.l+a,hi=b.h+a,op=b.o+a;

(function gestures(){
  const cv=C.cv,pts=new Map();let drag=null,pinch=null,lp=null,crossMode=false;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const clampOff=()=>{const vis=(C.w-62)/C.barW;C.off=Math.max(-vis*0.5,Math.min(C.data.length-5,C.off))};
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);pts.set(e.pointerId,p);
    if(pts.size===1){drag={x:p.x,off:C.off};if(e.pointerType!=='mouse')lp=setTimeout(()=>{crossMode=true;C.cross=p;draw()},350)}
    else if(pts.size===2){clearTimeout(lp);crossMode=false;C.cross=null;const[a,b]=[...pts.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y)||1,barW:C.barW};drag=null}});
  cv.addEventListener('pointermove',e=>{const p=pos(e);
    if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){C.cross=p;draw()}return}
    pts.set(e.pointerId,p);
    if(pts.size===2&&pinch){const[a,b]=[...pts.values()];C.barW=Math.max(2,Math.min(40,pinch.barW*Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist));clampOff();draw();return}
    if(crossMode){C.cross=p;draw();return}
    if(drag){const dx=p.x-drag.x;if(Math.abs(dx)>5)clearTimeout(lp);C.off=drag.off+dx/C.barW;clampOff();if(e.pointerType==='mouse')C.cross=p;draw()}});
  const end=e=>{pts.delete(e.pointerId);clearTimeout(lp);if(pts.size<2)pinch=null;if(pts.size===0){drag=null;if(crossMode||e.pointerType!=='mouse'){crossMode=false;C.cross=null;draw()}}else{const p=[...pts.values()][0];drag={x:p.x,off:C.off}}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!pts.size){C.cross=null;draw()}});
  cv.addEventListener('wheel',e=>{e.preventDefault();C.barW=Math.max(2,Math.min(40,C.barW*(e.deltaY<0?1.12:0.89)));clampOff();draw()},{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  new ResizeObserver(resize).observe($('#cwrap'));
})();

   <label class="chk"><span>紅漲綠跌（台股習慣；預設為綠漲紅跌）</span><input type="checkbox" id="upRed" ${S.upRed?'checked':''}></label>
   <div class="two" style="margin-top:10px"><button class="btn" id="icReset">恢復預設值</button><button class="btn brand" data-x="1">完成</button></div>
   <p class="hint">改動會立刻套用到圖表。週期可填 1～500；指標是用已載入的K線在本機計算，不會消耗行情額度。</p>`);
  const apply=e=>{const t=e.target;if(t.id==='upRed'){S.upRed=t.checked}else if(t.dataset.k){const p=t.dataset.k.split('.');let o=S.ic;for(let i=0;i<p.length-1;i++)o=o[p[i]];const k=p[p.length-1];
      if(t.type==='checkbox')o[k]=t.checked;else if(t.tagName==='SELECT')o[k]=t.value;else{let v=num(t.value);if(v==null||v<=0)return;v=t.dataset.f?Math.max(0.1,Math.min(10,v)):Math.max(1,Math.min(500,Math.round(v)));o[k]=v}}
    save();recomputeJ();draw()};
  $('#sheet').onchange=apply;$('#sheet').oninput=apply;
  $('#icReset').onclick=()=>{S.ic=JSON.parse(JSON.stringify(DEF.ic));save();recomputeJ();draw();indSheet()};
}
function setSheet(){
  sheet(head('設定')+`<label class="f"><span>Twelve Data API 金鑰（留空＝示範模式）</span><input id="sKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上金鑰"></label>
  <p class="hint">到 <a href="https://twelvedata.com/" target="_blank" rel="noopener">twelvedata.com</a> 免費註冊後，在後台的 API Keys 頁面複製。金鑰只存在這台裝置的瀏覽器裡。</p>
  <div class="two"><label class="f"><span>報價更新間隔</span><select id="sInt">${[10,15,20,30,60].map(v=>`<option value="${v}" ${v===S.interval?'selected':''}>${v} 秒</option>`).join('')}</select></label>
  <label class="f"><span>槓桿（新倉適用）</span><select id="sLev">${[10,30,50,100,200,500].map(v=>`<option value="${v}" ${v===S.lev?'selected':''}>1:${v}</option>`).join('')}</select></label></div>
  <p class="hint" id="sQuota"></p>
  <button class="btn brand full" id="sSave">儲存</button>
  <h3 style="margin-left:0">帳戶</h3><div class="two"><label class="f"><span>金額（美元）</span><input id="sAmt" inputmode="decimal" value="10000"></label><div style="display:flex;align-items:flex-end;padding-bottom:8px"><button class="btn full" id="sDep">入金</button></div></div>
  <button class="btn red full" id="sReset">重設帳戶（清空持倉與紀錄，餘額設為上方金額）</button><div class="err" id="sErr"></div>
  <h3 style="margin-left:0">備份</h3><div class="two"><button class="btn" id="sExp">匯出備份</button><button class="btn" id="sImp">匯入備份</button></div><input type="file" id="sFile" accept="application/json,.json" hidden>
  <p class="hint">資料存在這台裝置的瀏覽器。換手機或清除瀏覽資料前，請先匯出備份。</p>`);
  $('#sKey').value=S.key;
  const quota=()=>{const iv=+$('#sInt').value,n=neededSyms().length,eff=Math.max(iv,Math.ceil(n*60/7)),perH=Math.round(3600/eff*n),used=S.credits.day===new Date().toISOString().slice(0,10)?S.credits.n:0;
    $('#sQuota').innerHTML=`會影響。每次更新、每個商品扣 1 點；免費額度是每分鐘 8 點、每天 800 點。<br>目前需要更新 <b>${n}</b> 個商品，選 ${iv} 秒${eff>iv?`（商品較多，實際會放慢到 ${eff} 秒）`:''}＝每小時約 <b>${perH}</b> 點，800 點約可連續看盤 <b>${(800/perH).toFixed(1)}</b> 小時。<br>今日已用 ${used} 點，剩 ${Math.max(0,800-used)} 點。視窗切到背景或休市時會自動暫停，不扣點。`};
  $('#sInt').onchange=quota;quota();
  $('#sSave').onclick=async()=>{const was=demo();S.key=$('#sKey').value.trim();S.interval=+$('#sInt').value;S.lev=+$('#sLev').value;
    if(was!==demo()){for(const k in px)delete px[k];for(const k in cache)delete cache[k];C.data=[];S.lastSeen={};if(S.pos.length||S.orders.length){S.pos=[];S.orders=[];toast('行情來源已切換，原本的持倉與掛單已清除（餘額與紀錄保留）',4500)}if(demo())for(const s in SYMS)px[s]={mid:DEMO_BASE[s],t:Date.now()}}
    save();closeSheet();await loadChart(true);await tick();schedule()};
  $('#sDep').onclick=()=>{const a=num($('#sAmt').value);if(!a||a<=0)return $('#sErr').textContent='請輸入金額';S.bal=r2(S.bal+a);S.hist.unshift({note:'入金',amt:a,ct:Date.now()});save();toast('已入金 '+fM(a));closeSheet()};
  let armed=false;$('#sReset').onclick=()=>{const a=num($('#sAmt').value);if(!a||a<=0)return $('#sErr').textContent='請輸入金額';if(!armed){armed=true;$('#sReset').textContent='再按一次確認重設（無法復原）';return}
    S.bal=r2(a);S.pos=[];S.orders=[];S.hist=[{note:'帳戶重設',amt:a,ct:Date.now()}];save();schedule();toast('帳戶已重設');closeSheet()};
  $('#sExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='fx-practice-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
  $('#sImp').onclick=()=>$('#sFile').click();
  $('#sFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(j.v!==1||!Array.isArray(j.pos))throw 0;localStorage.setItem(KEY,JSON.stringify(j));location.reload()}catch(_){$('#sErr').textContent='這不是有效的備份檔'}};rd.readAsText(f)};
}
$('#gear').onclick=setSheet;$('#hSym').onclick=()=>go('vQuotes');
$('#qSell').onclick=()=>orderSheet('sell');$('#qBuy').onclick=()=>orderSheet('buy');
const lotIn=$('#lotIn');lotIn.value=S.lots;
const setLots=v=>{S.lots=Math.max(0.01,Math.min(100,r2(v)));lotIn.value=S.lots;save()};
$('#lotM').onclick=()=>setLots(S.lots-(S.lots>1?0.1:0.01));$('#lotP').onclick=()=>setLots(S.lots+(S.lots>=1?0.1:0.01));lotIn.onchange=()=>setLots(num(lotIn.value)||0.01);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!demo()){tick();schedule()}});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});

/* ================= 啟動 ================= */
window.__fx={get S(){return S},px,C,I,setPx,openPos,closePos,checkBar,acct,pnl,marginFor,bid,ask};
(async function init(){
  if(demo()){for(const s in SYMS)if(!px[s])px[s]={mid:DEMO_BASE[s],t:Date.now()}}
  const layout=()=>{O={};$('#ticket').innerHTML='';if($('#shade').classList.contains('on'))closeSheet();if(desk())orderSheet('buy',$('#ticket'));go(desk()?'vTrade':'vChart');renderLive()};
  mq.addEventListener('change',layout);
  renderTabs();renderTfs();layout();
  if(!demo())setStatus('wait','連線中…');
  await loadChart();
  await catchUp();
  await tick();schedule();
})();
</script>
